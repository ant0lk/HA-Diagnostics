[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-diagnostics"
version = "1.0.0-alpha.6"
description = "Read-only Home Assistant diagnostic ZIP with configuration, logs and 24-hour history"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "websockets==16.0", "PyJWT==2.10.1", "cryptography==46.0.5", "tzdata==2026.2", "PyYAML==6.0.3"]

[project.scripts]
ha-diagnostics = "ha_diagnostics.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
